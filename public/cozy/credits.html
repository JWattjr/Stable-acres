</head><body><main><p><a href="./">← Back to the farm</a></p><pre id="c">Loading…</pre></main>
<script>
// Response.text() always decodes UTF-8, so the dashes and quotes in CREDITS.md render correctly on any host.
fetch('CREDITS.md').then(r => r.text()).then(t => { document.getElementById('c').textContent = t; })
  .catch(() => { document.getElementById('c').textContent = 'Credits unavailable offline — see CREDITS.md in the repository.'; });
</script></body></html>
